<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bíadán — Dinner, decided.</title>
<meta name="description" content="Bíadán plans your week of dinners, builds your grocery list, and hands it off to Instacart. Old Irish for little food — dinner solved.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #faf6f1;
    color: #2c2420;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .logo {
    margin-bottom: 28px;
  }
  .brand-lockup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .brand-mark {
    width: clamp(48px, 12vw, 64px);
    height: auto;
    display: block;
    flex: none;
    overflow: hidden;
  }
  .wordmark, .headline {
    font-family: 'Fraunces', Georgia, serif;
  }
  .wordmark {
    font-size: clamp(3rem, 10vw, 4rem);
    font-weight: 600;
    line-height: 1.1;
    color: #c4785a;
  }
  .pronunciation {
    margin-top: 12px;
    font-size: 0.75rem;
    line-height: 1.4;
    color: #8a7f78;
  }
  .headline {
    font-size: clamp(1.75rem, 6vw, 2.5rem);
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .tagline {
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: #8a7f78;
    max-width: 480px;
    line-height: 1.6;
    margin-bottom: 40px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 400px;
  }
  input, button { font-family: inherit; }
  input[type="email"] {
    padding: 16px 20px;
    border-radius: 12px;
    border: 1px solid #e5ddd4;
    background: #ffffff;
    color: #2c2420;
    font-size: 1rem;
    outline: none;
  }
  input[type="email"]:focus {
    border-color: #c4785a;
    box-shadow: 0 0 0 3px rgba(196, 120, 90, 0.18);
  }
  input[type="email"]::placeholder { color: #8a7f78; }
  button {
    padding: 16px 20px;
    border-radius: 12px;
    border: none;
    background: #c4785a;
    color: #2c2420;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #d4926e; }
  .note {
    margin-top: 24px;
    font-size: 0.85rem;
    color: #8a7f78;
  }
  .note em { color: #8a7f78; font-style: normal; }
</style>
</head>
<body>
  <div class="logo">
    <div class="brand-lockup">
      <svg class="brand-mark" viewBox="320 232 322 316" aria-hidden="true" focusable="false">
        <image href="logo.png" width="1942" height="809" />
      </svg>
      <span class="wordmark">Bíadán</span>
    </div>
    <p class="pronunciation">pronounced BEE-uh-dawn</p>
  </div>
  <h1 class="headline">Dinner, decided.</h1>
  <p class="tagline">Old Irish for "little food." Bíadán plans your week of dinners, builds your grocery list, and hands it off to Instacart. No deciding. No seventeen-minute deliberation. Just dinner.</p>
  <form name="waitlist" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="waitlist">
    <p style="display:none"><label>Don't fill this out: <input name="bot-field"></label></p>
    <input type="email" name="email" placeholder="Enter your email for early access" required>
    <button type="submit">Join the waitlist</button>
  </form>
  <p class="note">Mealime shut down. We're bringing it back — <em>better</em>.</p>
</body>
</html>
