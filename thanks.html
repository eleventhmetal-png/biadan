<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're on the list — Bíadán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #faf6f1;
    color: #2c2420;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .logo { margin-bottom: 40px; }
  .brand-lockup { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .brand-mark { width: clamp(48px, 12vw, 64px); height: auto; display: block; flex: none; overflow: hidden; }
  .wordmark, h1 { font-family: 'Fraunces', Georgia, serif; }
  .wordmark { font-size: clamp(3rem, 10vw, 4rem); font-weight: 600; line-height: 1.1; color: #c4785a; }
  h1 { font-size: clamp(1.75rem, 6vw, 2.5rem); font-weight: 400; line-height: 1.2; margin-bottom: 16px; max-width: 620px; }
  h1 span { color: #c4785a; }
  .message { color: #8a7f78; max-width: 420px; line-height: 1.6; margin-bottom: 28px; }
  .back { display: inline-block; padding: 16px 24px; border-radius: 12px; background: #c4785a; color: #2c2420; text-decoration: none; font-weight: 600; }
  .back:hover { background: #d4926e; }
  .back:focus-visible, button:focus-visible { outline: 3px solid #2c2420; outline-offset: 4px; }
  .return-note { color: #8a7f78; font-size: .85rem; margin: 18px 0 10px; }
  button { background: none; border: none; color: #8a7f78; font: inherit; font-size: .85rem; cursor: pointer; text-decoration: underline; padding: 8px; }
</style>
</head>
<body>
  <div class="logo">
    <div class="brand-lockup">
      <svg class="brand-mark" viewBox="320 232 322 316" aria-hidden="true" focusable="false">
        <image href="logo.png" width="1942" height="809" />
      </svg>
      <span class="wordmark">Bíadán</span>
    </div>
  </div>
  <h1>You're on the list. <span>Dinner's coming.</span></h1>
  <p class="message">We'll email you when Bíadán opens up. In the meantime, tell a friend who's tired of deciding what's for dinner.</p>
  <a class="back" id="back-home" href="/">← Back to Bíadán</a>
  <p class="return-note" id="return-note">Use the button above to return to Bíadán.</p>
  <button id="stay-here" type="button" hidden>Stay on this page</button>
  <script>
    const returnNote = document.getElementById('return-note');
    const stayButton = document.getElementById('stay-here');
    returnNote.textContent = 'Returning to Bíadán in 8 seconds.';
    stayButton.hidden = false;
    const returnTimer = window.setTimeout(() => window.location.replace('/'), 8000);
    stayButton.addEventListener('click', () => {
      window.clearTimeout(returnTimer);
      returnNote.textContent = 'Automatic return paused. Use the Back button when you are ready.';
      stayButton.hidden = true;
    });
  </script>
</body>
</html>
