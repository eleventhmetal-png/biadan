<!DOCTYPE html>

<title>You're on the list — Bíadán</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #141414;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

  }
  .logo svg {

    height: 48px;
    flex-shrink: 0;
  }
  .logo-word {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #d97706;
    line-height: 1;
  }

  h1 span { color: #d97706; }
  p { color: #a8a29e; max-width: 420px; line-height: 1.6; margin-bottom: 32px; }

  a:hover { text-decoration: underline; }

<body>
  <div class="logo">
    <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 55 C20 85 45 105 60 105 C75 105 100 85 100 55" stroke="#d97706" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M20 55 C20 25 45 15 60 15 C75 15 100 25 100 55" stroke="#d97706" stroke-width="8" fill="none" stroke-linecap="round"/>
